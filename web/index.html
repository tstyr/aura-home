<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#383838"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="時計、天気、タイマー。iPadとPCのための静かなホーム。"><title>Aura Home</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2310151f'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23a4caff' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23a4caff'/%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css?v=18"><link rel="stylesheet" href="/hub.css?v=18"><link rel="stylesheet" href="/design.css?v=18"><script src="/session-context.js"></script><script src="/design.js?v=18" defer></script><script src="/google-ui.js?v=18" defer></script><script src="/hub.js?v=18" defer></script><script src="/features.js?v=18" defer></script><script src="/app.js?v=18" defer></script></head>
<body><div id="aura-app"><div class="ambience" aria-hidden="true"><img id="wallpaper" alt="" hidden></div><span id="connection" class="connection-status" hidden>オフライン</span>
<button id="account-open" type="button" class="account-button" aria-label="アカウント設定を開く" title="アカウント設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></button>
<main id="home" tabindex="0" aria-label="ホーム"><button id="clock-dismiss" type="button" class="clock-dismiss" aria-label="アプリを開く"></button><section class="clock-zone"><p id="date" class="date"></p><h1 class="time" aria-label="現在の時刻"><span id="hours">--</span><span class="colon">:</span><span id="minutes">--</span><span id="clock-seconds" class="clock-seconds" hidden></span></h1><div id="timer-mini" class="timer-mini" hidden><span id="mini-remaining"></span><span id="timer-mini-label">タイマー</span></div></section>
<section id="launcher" class="launcher" aria-label="アプリ" inert><div class="launcher-heading"><h2>アプリ</h2><div class="slide-controls"><button class="icon-button" id="slide-prev" aria-label="前のタイル"></button><button class="icon-button" id="slide-next" aria-label="次のタイル"></button></div></div><div id="tiles" class="tiles"><button class="tile clock-tile" data-app="clock"><span class="tile-icon" data-icon="clock"></span><span class="tile-caption"><span class="tile-name">時計</span></span><span class="tile-detail" id="tile-clock">--:--</span></button><button class="tile weather-tile" data-app="weather"><span class="tile-icon" data-icon="sun"></span><span class="tile-caption"><span class="tile-name">天気</span></span><span class="tile-detail" id="tile-weather">—°</span></button><button class="tile timer-tile" data-app="timer"><span class="tile-icon" data-icon="timer"></span><span class="tile-caption"><span class="tile-name">タイマー</span></span><span class="tile-detail" id="tile-timer">25:00</span></button><button class="tile stats-tile" data-app="stats"><span class="tile-icon" data-icon="stats"></span><span class="tile-caption"><span class="tile-name">音楽</span></span></button><button class="tile background-tile" data-app="background"><span class="tile-icon" data-icon="image"></span><span class="tile-caption"><span class="tile-name">背景</span></span></button><button class="tile settings-tile" data-app="settings"><span class="tile-icon" data-icon="settings"></span><span class="tile-caption"><span class="tile-name">設定</span></span></button><button class="tile calendar-tile" data-app="calendar"><span class="tile-icon" data-icon="calendar"></span><span class="tile-caption"><span class="tile-name">カレンダー</span></span><span class="tile-detail" id="tile-calendar"></span></button><button class="tile tasks-tile" data-app="tasks"><span class="tile-icon" data-icon="tasks"></span><span class="tile-caption"><span class="tile-name">ToDo</span></span><span class="tile-detail" id="tile-tasks"></span></button><button class="tile" data-app="news"><span class="tile-icon" data-icon="news"></span><span class="tile-caption"><span class="tile-name">ニュース</span></span></button><button class="tile" data-app="today"><span class="tile-icon" data-icon="summary"></span><span class="tile-caption"><span class="tile-name">今日のまとめ</span></span></button><button class="tile" data-app="transit"><span class="tile-icon" data-icon="train"></span><span class="tile-caption"><span class="tile-name">交通</span></span></button><button class="tile" data-app="sports"><span class="tile-icon" data-icon="sports"></span><span class="tile-caption"><span class="tile-name">スポーツ</span></span></button><button class="tile" data-app="entertainment"><span class="tile-icon" data-icon="film"></span><span class="tile-caption"><span class="tile-name">映画・アニメ</span></span></button><button class="tile" data-app="worldclock"><span class="tile-icon" data-icon="world"></span><span class="tile-caption"><span class="tile-name">世界時計</span></span></button></div></section><button id="home-agenda" class="home-agenda" hidden aria-label="今日の予定を開く"><span id="home-agenda-time"></span><strong id="home-agenda-title"></strong></button><section id="home-widgets" class="home-widgets" aria-label="情報ウィジェット" hidden></section></main>
<footer class="bottom-bar"><button id="weather-peek" class="weather-peek" aria-label="天気を開く"><span data-icon="sun" class="peek-icon"></span><span><strong id="peek-temp">—°</strong><span id="peek-place">天気を設定</span></span></button></footer>
<dialog id="panel" aria-labelledby="panel-title"><div class="panel-header"><span class="panel-drag-handle" aria-hidden="true"></span><div><p class="eyebrow" id="panel-eyebrow">AURA HOME</p><h2 id="panel-title"></h2></div><div class="panel-header-end"><time id="panel-clock" class="panel-clock"></time><button id="panel-close" autofocus class="icon-button" aria-label="閉じる"></button></div></div><div id="panel-content"></div></dialog><div class="toast" id="toast" role="status" hidden></div></div></body></html>
